sonar.projectName=Vanika AI CI Demo
sonar.sourceEncoding=UTF-8
sonar.sources=demo,apps,services
sonar.tests=tests
sonar.python.version=3.12
sonar.python.coverage.reportPaths=coverage.xml
# Keep tests out of main sources even if the CLI overrides sonar.sources to '.'.
sonar.exclusions=tests/**,**/__pycache__/**,**/workspace/**,.scannerwork/**,.venv/**
