# Vanika on Kubernetes.
#
# Mirrors docker-compose.yml: same images, environment, health checks and
# resource ceilings. Apply into a namespace that already holds the
# `vanika-secrets` Secret described in this directory's README.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: vanika-config
data:
  NODE_ENV: "production"
  SRM_SERVICE_URL: "http://srm-service:3001"
  AI_PROXY_URL: "http://ai-proxy:3002"
  REDIS_URL: "redis://redis:6379"
  KAFKA_BROKERS: "kafka:9092"
  # The tenant path connects as an unprivileged role so row-level security is
  # actually enforced. See deploy/k8s/README.md.
  MISTRAL_ONLY: "false"
  OLLAMA_MODEL: "llama3.1:8b"
  PUBLIC_APP_URL: "http://localhost:8080"
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
spec:
  clusterIP: None
  selector: { app: postgres }
  ports: [{ port: 5432, targetPort: 5432 }]
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
spec:
  serviceName: postgres
  replicas: 1
  selector: { matchLabels: { app: postgres } }
  template:
    metadata: { labels: { app: postgres } }
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          env:
            - { name: POSTGRES_USER, value: "user" }
            - { name: POSTGRES_DB, value: "vanikadb" }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: vanika-secrets, key: POSTGRES_PASSWORD } }
            - { name: PGDATA, value: /var/lib/postgresql/data/pgdata }
          ports: [{ containerPort: 5432 }]
          readinessProbe:
            exec: { command: ["pg_isready", "-U", "user", "-d", "vanikadb"] }
            initialDelaySeconds: 10
            periodSeconds: 5
          resources:
            requests: { memory: "256Mi", cpu: "100m" }
            limits: { memory: "1Gi", cpu: "2" }
          volumeMounts: [{ name: data, mountPath: /var/lib/postgresql/data }]
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: ["ReadWriteOnce"]
        resources: { requests: { storage: 20Gi } }
---
apiVersion: v1
kind: Service
metadata: { name: redis }
spec:
  selector: { app: redis }
  ports: [{ port: 6379, targetPort: 6379 }]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: redis }
spec:
  replicas: 1
  selector: { matchLabels: { app: redis } }
  template:
    metadata: { labels: { app: redis } }
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          args: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "200mb", "--maxmemory-policy", "allkeys-lru"]
          ports: [{ containerPort: 6379 }]
          readinessProbe:
            exec: { command: ["redis-cli", "ping"] }
            initialDelaySeconds: 5
          resources:
            requests: { memory: "32Mi", cpu: "50m" }
            limits: { memory: "256Mi", cpu: "1" }
---
apiVersion: v1
kind: Service
metadata: { name: kafka }
spec:
  selector: { app: kafka }
  ports: [{ name: internal, port: 9092 }, { name: external, port: 19092 }]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: kafka }
spec:
  replicas: 1
  selector: { matchLabels: { app: kafka } }
  template:
    metadata: { labels: { app: kafka } }
    spec:
      containers:
        - name: redpanda
          image: redpandadata/redpanda:v24.2.7
          # Capped deliberately: unbounded, Redpanda spun on every core.
          args:
            - redpanda
            - start
            - --smp=1
            - --memory=1G
            - --reserve-memory=0M
            - --overprovisioned
            - --default-log-level=warn
            - --kafka-addr=PLAINTEXT://0.0.0.0:9092
            - --advertise-kafka-addr=PLAINTEXT://kafka:9092
          ports: [{ containerPort: 9092 }]
          resources:
            requests: { memory: "512Mi", cpu: "200m" }
            limits: { memory: "1400Mi", cpu: "2" }
---
apiVersion: v1
kind: Service
metadata: { name: gateway-service }
spec:
  selector: { app: gateway-service }
  ports: [{ port: 3000, targetPort: 3000 }]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: gateway-service }
spec:
  replicas: 2
  selector: { matchLabels: { app: gateway-service } }
  template:
    metadata: { labels: { app: gateway-service } }
    spec:
      containers:
        - name: gateway
          image: ghcr.io/adityapuppala1/vanika-gateway:latest
          envFrom: [{ configMapRef: { name: vanika-config } }, { secretRef: { name: vanika-secrets } }]
          env:
            - name: DATABASE_URL
              value: "postgresql://user:$(POSTGRES_PASSWORD)@postgres:5432/vanikadb"
            # The unprivileged role. Row-level security is only enforced because
            # the tenant path uses this rather than the owner.
            - name: APP_DATABASE_URL
              value: "postgresql://vanika_app:$(APP_DB_PASSWORD)@postgres:5432/vanikadb"
          ports: [{ containerPort: 3000 }]
          readinessProbe:
            httpGet: { path: /v1/health, port: 3000 }
            initialDelaySeconds: 20
            periodSeconds: 10
          resources:
            requests: { memory: "128Mi", cpu: "100m" }
            limits: { memory: "768Mi", cpu: "2" }
---
apiVersion: v1
kind: Service
metadata: { name: srm-service }
spec:
  selector: { app: srm-service }
  ports: [{ port: 3001, targetPort: 3001 }]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: srm-service }
spec:
  replicas: 2
  selector: { matchLabels: { app: srm-service } }
  template:
    metadata: { labels: { app: srm-service } }
    spec:
      containers:
        - name: srm
          image: ghcr.io/adityapuppala1/vanika-srm:latest
          envFrom: [{ configMapRef: { name: vanika-config } }, { secretRef: { name: vanika-secrets } }]
          env:
            - name: DATABASE_URL
              value: "postgresql://user:$(POSTGRES_PASSWORD)@postgres:5432/vanikadb"
            - name: APP_DATABASE_URL
              value: "postgresql://vanika_app:$(APP_DB_PASSWORD)@postgres:5432/vanikadb"
          ports: [{ containerPort: 3001 }]
          readinessProbe:
            httpGet: { path: /health, port: 3001 }
            initialDelaySeconds: 20
          resources:
            requests: { memory: "128Mi", cpu: "100m" }
            limits: { memory: "768Mi", cpu: "2" }
---
apiVersion: v1
kind: Service
metadata: { name: ai-proxy }
spec:
  selector: { app: ai-proxy }
  ports: [{ port: 3002, targetPort: 3002 }]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: ai-proxy }
spec:
  replicas: 2
  selector: { matchLabels: { app: ai-proxy } }
  template:
    metadata: { labels: { app: ai-proxy } }
    spec:
      containers:
        - name: ai-proxy
          image: ghcr.io/adityapuppala1/vanika-ai-proxy:latest
          envFrom: [{ configMapRef: { name: vanika-config } }, { secretRef: { name: vanika-secrets } }]
          ports: [{ containerPort: 3002 }]
          readinessProbe:
            httpGet: { path: /health, port: 3002 }
            initialDelaySeconds: 15
          resources:
            requests: { memory: "128Mi", cpu: "100m" }
            limits: { memory: "768Mi", cpu: "2" }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: sim-worker }
spec:
  # Each run is independent, so replicas are simulations in parallel.
  replicas: 2
  selector: { matchLabels: { app: sim-worker } }
  template:
    metadata: { labels: { app: sim-worker } }
    spec:
      containers:
        - name: sim-worker
          image: ghcr.io/adityapuppala1/vanika-sim-worker:latest
          envFrom: [{ configMapRef: { name: vanika-config } }, { secretRef: { name: vanika-secrets } }]
          resources:
            requests: { memory: "128Mi", cpu: "200m" }
            limits: { memory: "1500Mi", cpu: "4" }
---
apiVersion: v1
kind: Service
metadata: { name: frontend }
spec:
  selector: { app: frontend }
  ports: [{ port: 80, targetPort: 80 }]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: frontend }
spec:
  replicas: 2
  selector: { matchLabels: { app: frontend } }
  template:
    metadata: { labels: { app: frontend } }
    spec:
      containers:
        - name: frontend
          image: ghcr.io/adityapuppala1/vanika-frontend:latest
          ports: [{ containerPort: 80 }]
          readinessProbe:
            httpGet: { path: /, port: 80 }
            initialDelaySeconds: 5
          resources:
            requests: { memory: "16Mi", cpu: "20m" }
            limits: { memory: "128Mi", cpu: "500m" }
