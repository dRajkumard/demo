# Dummy services for CI/CD testing. No API keys or databases required.
name: vanikaai-demo
services:
  frontend:
    build:
      context: .
      dockerfile: apps/VanikaAi-Frontend/Dockerfile
      target: runtime
    ports:
    - 127.0.0.1:${FRONTEND_PORT:-18080}:8080
    restart: unless-stopped
    cpus: 0.5
    mem_limit: 128m
  gateway-service:
    build:
      context: .
      dockerfile: services/Gateway-Service/Dockerfile
      target: runtime
    ports:
    - 127.0.0.1:${GATEWAY_PORT:-13001}:3000
    restart: unless-stopped
    cpus: 0.5
    mem_limit: 128m
  srm-service:
    build:
      context: .
      dockerfile: services/srm-service/Dockerfile
      target: runtime
    ports:
    - 127.0.0.1:${SRM_PORT:-13002}:3001
    restart: unless-stopped
    cpus: 0.5
    mem_limit: 128m
  ai-proxy:
    build:
      context: .
      dockerfile: services/ai-proxy/Dockerfile
      target: runtime
    ports:
    - 127.0.0.1:${AI_PROXY_PORT:-13004}:3002
    restart: unless-stopped
    cpus: 0.5
    mem_limit: 128m
  sim-worker:
    build:
      context: .
      dockerfile: services/sim-worker/Dockerfile
      target: runtime
    ports:
    - 127.0.0.1:${SIM_WORKER_PORT:-18003}:8003
    restart: unless-stopped
    cpus: 0.5
    mem_limit: 128m
  ubuntu-sandbox:
    build:
      context: .
      dockerfile: services/Gateway-Service/Dockerfile.sandbox
      target: runtime
    ports:
    - 127.0.0.1:${SANDBOX_PORT:-17447}:7447
    restart: unless-stopped
    cpus: 0.5
    mem_limit: 128m
