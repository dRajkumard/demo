name: CI/CD

on:
  push:
    branches: [main, master, development, V2]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  source_check:
    name: Validate demo build inputs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet
      - run: python3 scripts/check-build-contexts.py

  tests:
    name: Test all demo services and collect coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install coverage==7.6.1
      - run: python -m coverage run --branch -m unittest discover -s tests -v
      - run: python -m coverage xml -o coverage.xml
      - run: python -m coverage report --fail-under=80
      - uses: actions/upload-artifact@v4
        with:
          name: python-coverage
          path: coverage.xml
          if-no-files-found: error

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan tracked history
        run: |
          VERSION=8.28.0
          curl --fail --silent --show-error --location --max-time 120 \
            "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /tmp gitleaks
          /tmp/gitleaks detect --config .gitleaks.toml \
            --baseline-path .gitleaks-baseline.json --redact --no-banner --exit-code 1

  builds:
    name: Docker build (${{ matrix.service }})
    needs: source_check
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [frontend, gateway-service, srm-service, ai-proxy, sim-worker, ubuntu-sandbox]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build the runtime image
        env:
          SERVICE: ${{ matrix.service }}
        run: docker compose build "$SERVICE"

  smoke:
    name: Start and smoke test the entire demo stack
    needs: source_check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose up -d --build --wait --wait-timeout 120
      - run: python3 scripts/smoke-demo.py
      - name: Container logs
        if: failure()
        run: docker compose logs --no-color
      - name: Stop demo containers
        if: always()
        run: docker compose down

  publish:
    name: Publish demo image (${{ matrix.service }})
    needs: [tests, secrets, builds, smoke]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        service: [frontend, gateway-service, srm-service, ai-proxy, sim-worker, ubuntu-sandbox]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Validate AWS settings
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
          EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
        run: |
          for setting in AWS_REGION AWS_ROLE_ARN EC2_INSTANCE_ID; do
            if [ -z "${!setting}" ]; then
              echo "::error::Configure repository Actions variable $setting."
              exit 1
            fi
          done
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - uses: aws-actions/amazon-ecr-login@v2
        id: ecr
      - name: Build and publish the tested revision
        env:
          SERVICE: ${{ matrix.service }}
          ECR_REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          image="${ECR_REGISTRY}/vanika-demo/${SERVICE}:${GITHUB_SHA}"
          export VANIKA_CI_IMAGE="$image"
          python3 - <<'PYOVERRIDE'
          import json, os
          from pathlib import Path
          Path('/tmp/publish.json').write_text(json.dumps({
              'services': {os.environ['SERVICE']: {'image': os.environ['VANIKA_CI_IMAGE']}}
          }))
          PYOVERRIDE
          docker compose -f docker-compose.yml -f /tmp/publish.json build "$SERVICE"
          docker push "$image"

  deploy:
    name: Deploy demo to AWS EC2
    needs: publish
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - uses: aws-actions/amazon-ecr-login@v2
        id: ecr
      - name: Deploy images and verify health through Systems Manager
        env:
          ECR_REGISTRY: ${{ steps.ecr.outputs.registry }}
          EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
        run: python3 scripts/deploy-ec2.py
