name: CI/CD

on:
  push:
    branches: [main, master, development, V2]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  source_check:
    name: Validate demo build inputs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet
      - run: python3 scripts/check-build-contexts.py

  tests:
    name: Test all demo services and collect coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install coverage==7.6.1
      - run: python -m coverage run --branch -m unittest discover -s tests -v
      - run: python -m coverage xml -o coverage.xml
      - run: python -m coverage report --fail-under=80
      - uses: actions/upload-artifact@v4
        with:
          name: python-coverage
          path: coverage.xml
          if-no-files-found: error

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan tracked history
        run: |
          VERSION=8.28.0
          curl --fail --silent --show-error --location --max-time 120 \
            "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /tmp gitleaks
          /tmp/gitleaks detect --config .gitleaks.toml \
            --baseline-path .gitleaks-baseline.json --redact --no-banner --exit-code 1

  builds:
    name: Docker build (${{ matrix.service }})
    needs: source_check
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [frontend, gateway-service, srm-service, ai-proxy, sim-worker, ubuntu-sandbox]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build the runtime image
        env:
          SERVICE: ${{ matrix.service }}
        run: docker compose build "$SERVICE"

  smoke:
    name: Start and smoke test the entire demo stack
    needs: source_check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose up -d --build --wait --wait-timeout 120
      - run: python3 scripts/smoke-demo.py
      - name: Container logs
        if: failure()
        run: docker compose logs --no-color
      - name: Stop demo containers
        if: always()
        run: docker compose down

  deploy:
    name: Deploy demo to EC2 through SSH
    needs: [tests, secrets, builds, smoke]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: ec2-demo-deployment
      cancel-in-progress: false
    steps:
      - name: Configure SSH
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_KNOWN_HOSTS: ${{ secrets.EC2_KNOWN_HOSTS }}
        run: |
          for setting in EC2_HOST EC2_USER EC2_SSH_KEY EC2_KNOWN_HOSTS; do
            if [ -z "${!setting}" ]; then
              echo "::error::Configure repository Actions secret $setting."
              exit 1
            fi
          done
          install -m 700 -d ~/.ssh
          umask 077
          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/deploy_key
          printf '%s\n' "$EC2_KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh-keygen -y -P '' -f ~/.ssh/deploy_key > /dev/null

      - name: Deploy tested revision and verify health
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          ssh \
            -i ~/.ssh/deploy_key \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=30 \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=6 \
            "${EC2_USER}@${EC2_HOST}" \
            bash -s -- "$GITHUB_SHA" <<'REMOTE'
          set -euo pipefail
          revision="$1"
          cd "$HOME/vanika/vanika-demo/vanika"
          exec 9> "$HOME/vanika/vanika-demo/deploy.lock"
          flock -w 60 9

          if [ -n "$(git status --porcelain)" ]; then
            echo "Deployment stopped: server checkout has local changes."
            exit 1
          fi
          override="$HOME/vanika/vanika-demo/compose.server.yml"
          test -f "$override"
          git fetch origin main
          git cat-file -e "${revision}^{commit}"
          git checkout --detach "$revision"

          compose=(sudo -n docker compose -f docker-compose.yml -f "$override")
          "${compose[@]}" config --quiet
          if ! "${compose[@]}" up -d --build --wait --wait-timeout 180; then
            "${compose[@]}" ps
            "${compose[@]}" logs --tail 100 --no-color
            exit 1
          fi
          "${compose[@]}" ps
          python3 scripts/smoke-demo.py
          REMOTE

      - name: Remove SSH credentials
        if: always()
        run: rm -f ~/.ssh/deploy_key ~/.ssh/known_hosts
