name: CI

on:
  push:
    branches: [main, master, development, V2]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source_check:
    name: Validate demo build inputs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet
      - run: python3 scripts/check-build-contexts.py

  tests:
    name: Test all demo services and collect coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install coverage==7.6.1
      - run: python -m coverage run --branch -m unittest discover -s tests -v
      - run: python -m coverage xml -o coverage.xml
      - run: python -m coverage report --fail-under=80
      - uses: actions/upload-artifact@v4
        with:
          name: python-coverage
          path: coverage.xml
          if-no-files-found: error

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan tracked history
        run: |
          VERSION=8.28.0
          curl --fail --silent --show-error --location --max-time 120 \
            "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /tmp gitleaks
          /tmp/gitleaks detect --config .gitleaks.toml \
            --baseline-path .gitleaks-baseline.json --redact --no-banner --exit-code 1

  builds:
    name: Docker build (${{ matrix.service }})
    needs: source_check
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [frontend, gateway-service, srm-service, ai-proxy, sim-worker, ubuntu-sandbox]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build the runtime image
        env:
          SERVICE: ${{ matrix.service }}
        run: docker compose build "$SERVICE"

  smoke:
    name: Start and smoke test the entire demo stack
    needs: source_check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose up -d --build --wait --wait-timeout 120
      - run: python3 scripts/smoke-demo.py
      - name: Container logs
        if: failure()
        run: docker compose logs --no-color
      - name: Stop demo containers
        if: always()
        run: docker compose down

  sonarqube:
    name: SonarQube quality gate
    needs: tests
    # Fork pull requests cannot receive the analysis token.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: python-coverage
      - name: Validate SonarQube configuration
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
          SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
        run: |
          for setting in SONAR_TOKEN SONAR_HOST_URL SONAR_PROJECT_KEY; do
            if [ -z "${!setting}" ]; then
              echo "::error::Configure $setting in the repository Actions settings."
              exit 1
            fi
          done
      - uses: SonarSource/sonarqube-scan-action@v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
        with:
          args: >-
            -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY }}
            -Dsonar.qualitygate.wait=true
            -Dsonar.qualitygate.timeout=600

  publish:
    name: Publish demo image (${{ matrix.service }})
    needs: [tests, secrets, builds, smoke, sonarqube]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service: [frontend, gateway-service, srm-service, ai-proxy, sim-worker, ubuntu-sandbox]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish the tested revision
        env:
          SERVICE: ${{ matrix.service }}
          REPOSITORY: ${{ github.repository }}
        run: |
          image="ghcr.io/${REPOSITORY,,}/${SERVICE}:${GITHUB_SHA}"
          export VANIKA_CI_IMAGE="$image"
          python3 - <<'PYOVERRIDE'
          import json, os
          from pathlib import Path
          Path('/tmp/publish.json').write_text(json.dumps({
              'services': {os.environ['SERVICE']: {'image': os.environ['VANIKA_CI_IMAGE']}}
          }))
          PYOVERRIDE
          docker compose -f docker-compose.yml -f /tmp/publish.json build "$SERVICE"
          docker push "$image"
